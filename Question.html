<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="timer-container">
      <div class="timer">
        <div class="timer-bar"></div>
      </div>
      <div class="action-btns">
        <button class="pause-btn">pause</button>
        <button class="cancel-btn">cancel</button>
      </div>
    </div>
    <div class="question">
      <div id="side-Q-img"><img src="./image.png" alt="example img" /></div>
      <div id="side-Q">
        <h1>What is?</h1>
        <div id="choices-container">
          <div class="choice">choice 1</div>
          <div class="choice">choice 2</div>
          <div class="choice">choice 3</div>
          <div class="choice">choice 4</div>
        </div>
      </div>

      <div class="side-bar">
        <div class="team">
          <span>👸</span>
        </div>
        <div class="lifelines-container Q">
          <div class="lifeline">
            <figure></figure>
            <figcaption>ask</figcaption>
          </div>
          <div class="lifeline">
            <figure></figure>
            <figcaption>ask</figcaption>
          </div>
          <div class="lifeline">
            <figure></figure>
            <figcaption>ask</figcaption>
          </div>
          <div class="lifeline">
            <figure></figure>
            <figcaption>ask</figcaption>
          </div>
          <div class="lifeline">
            <figure></figure>
            <figcaption>ask</figcaption>
          </div>
        </div>
        <button class="done-btn">ج</button>
      </div>
    </div>
  </body>
</html>
