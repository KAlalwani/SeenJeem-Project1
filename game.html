<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeenJeem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body class="body">
    
    <div class="main">
      <div class="team-side">
    <div class="score-bar-container">
        <div class="points-counter"></div>
    </div>
    <span class="team-points">0</span>
        <div class="team">
          <span>👸</span>
          <span>Team 1</span>
        </div>
      </div>
      <div class="main-game">
          <div class="hero-section">
              <h1>سين جيم</h1>
              <div class="game-rounds-conatiner">
                  <span id="game-rounds">1</span>
                  <span aria-hidden="true"> / </span>
                  <span id="game-total-rounds">25</span>
                  <span>rounds</span>
              </div>
          </div>
          <table id="game">
              <tr id="categories-row">
                  <th class="game-category"></th>
                  <th class="game-category"></th>
                  <th class="game-category"></th>
                  <th class="game-category"></th>
                  <th class="game-category"></th>
              </tr>
              <tr id="Qs-100-row">
                  <td class="Q-100 Q">100</td>
                  <td class="Q-100 Q">100</td>
                  <td class="Q-100 Q">100</td>
                  <td class="Q-100 Q">100</td>
                  <td class="Q-100 Q">100</td>
              </tr>
              <tr id="Qs-200-row">
                  <td class="Q-200 Q">200</td>
                  <td class="Q-200 Q">200</td>
                  <td class="Q-200 Q">200</td>
                  <td class="Q-200 Q">200</td>
                  <td class="Q-200 Q">200</td>
              </tr>
              <tr id="Qs-300-row">
                  <td class="Q-300 Q">300</td>
                  <td class="Q-300 Q">300</td>
                  <td class="Q-300 Q">300</td>
                  <td class="Q-300 Q">300</td>
                  <td class="Q-300 Q">300</td>
              </tr>
              <tr id="Qs-400-row">
                  <td class="Q-400 Q">400</td>
                  <td class="Q-400 Q">400</td>
                  <td class="Q-400 Q">400</td>
                  <td class="Q-400 Q">400</td>
                  <td class="Q-400 Q">400</td>
              </tr>
              <tr id="Qs-500-row">
                  <td class="Q-500 Q">500</td>
                  <td class="Q-500 Q">500</td>
                  <td class="Q-500 Q">500</td>
                  <td class="Q-500 Q">500</td>
                  <td class="Q-500 Q">500</td>
              </tr>
          </table>
      </div>
      <div class="team-side">
        <div class="score-bar-container">
          <div class="points-counter"></div>
        </div>
        <span class="team-points">0</span>
        <div class="team">
          <span>🤸‍♀️</span>
          <span>Team 2</span>
        </div>
      </div>
    </div>
  </body>
</html>
