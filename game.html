<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeenJeem</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="timer">
      <div class="action-btns">
        <button class="pause-btn">pause</button>
        <button class="cancel-btn">cancel</button>
      </div>
    </div>
    <div class="team-side">
      <div class="points-counter">
        <span class="team-points"></span>
      </div>
      <div class="team">
        <span>👸</span>
        <input type="text" class="team-names" />
      </div>
    </div>
    <div class="main-game">
        <div class="hero-section">
            <h1>سين جيم</h1>
            <div class="game-rounds-conatiner">
                <span id="game-rounds">1</span>
                <span>rounds</span>
            </div>
        </div>
        <table id="game">
            <tr id="categories-row">
                <th class="game-category">History</th>
                <th class="game-category">Coding</th>
                <th class="game-category">People</th>
                <th class="game-category">Countries</th>
                <th class="game-category">Cartoons</th>
            </tr>
            <tr id="Qs-100-row">
                <td class="Q-100">100$</td>
                <td class="Q-100">100$</td>
                <td class="Q-100">100$</td>
                <td class="Q-100">100$</td>
                <td class="Q-100">100$</td>
            </tr>
            <tr id="Qs-200-row">
                <td class="Q-200">200$</td>
                <td class="Q-200">200$</td>
                <td class="Q-200">200$</td>
                <td class="Q-200">200$</td>
                <td class="Q-200">200$</td>
            </tr>
            <tr id="Qs-300-row">
                <td class="Q-300">300$</td>
                <td class="Q-300">300$</td>
                <td class="Q-300">300$</td>
                <td class="Q-300">300$</td>
                <td class="Q-300">300$</td>
            </tr>
            <tr id="Qs-400-row">
                <td class="Q-400">400$</td>
                <td class="Q-400">400$</td>
                <td class="Q-400">400$</td>
                <td class="Q-400">400$</td>
                <td class="Q-400">400$</td>
            </tr>
            <tr id="Qs-500-row">
                <td class="Q-500">500$</td>
                <td class="Q-500">500$</td>
                <td class="Q-500">500$</td>
                <td class="Q-500">500$</td>
                <td class="Q-500">500$</td>
            </tr>
        </table>
    </div>
    <div class="team-side">
      <div class="points-counter">
        <span class="team-points"></span>
      </div>
      <div class="team">
        <span>👸</span>
        <input type="text" class="team-names" />
      </div>
    </div>
  </body>
</html>
