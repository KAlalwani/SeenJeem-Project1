<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
    <main>
        <div class="hero-section">
            <h1>Teams</h1>
        </div>
        <div class="teams-container">
            <div class="team">
                <span>👸</span>
                <input type="text" class="team-names">
            </div>
            <div class="team">
                <span>🤸‍♀️</span>
                <input type="text" class="team-names">
            </div>
            <div id="computer-container">
                <span>Computer</span>
                <input type="checkbox" >
            </div>
        </div>
        <div id="game-settings">
            <div id="roundsAndPoints">
                <div class="rounds-container">
                    <input type="checkbox" id="rounds">
                    <span>Rounds</span>
                    <input type="number" id="rounds-amount" disabled>
                </div>
                <div class="Points-container">
                    <input type="checkbox" id="points">
                    <span>Points</span>
                    <input type="number" id="points-amount" disabled>
                </div>
            </div>
            <span>Life Lines</span>
            <span class="lifeline-team-label">Team 1 lifelines</span>
            <div class="lifelines-container team">
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
            </div>
            <span class="lifeline-team-label">Team 2 lifelines</span>
            <div class="lifelines-container team">
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
                <div class="lifeline">
                    <figure></figure>
                    <figcaption>ask</figcaption>
                </div>
            </div>
        </div>
        <button class="start-btn">START</button>
    </main>
</body>
</html>
